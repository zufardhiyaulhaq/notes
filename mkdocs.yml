site_name: Zufar's Notes
site_description: TIL, cheatsheets, and engineering guides.
site_author: Zufar Dhiyaulhaq
site_url: https://notes.zufardhiyaulhaq.com

repo_name: zufardhiyaulhaq/notes
repo_url: https://github.com/zufardhiyaulhaq/notes
edit_uri: edit/master/docs/

theme:
  name: material
  language: en
  font:
    text: Schibsted Grotesk
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zufardhiyaulhaq
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/zufardhiyaulhaq
  homepage: https://zufardhiyaulhaq.com

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
      ignore_h1_titles: true
  - awesome-pages
  - tags
  - blog:
      blog_dir: til
      blog_toc: true
      post_url_format: "{slug}"
      post_readtime: true
      archive: true
      categories: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Navigation order and section titles are controlled by the
# mkdocs-awesome-pages-plugin via `.pages` files in docs/ and its subdirectories.
